name: Update data

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Fetch every source, ignoring min_hours
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch cloud sources
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m pipeline.run --runner cloud ${{ inputs.force && '--force' || '' }}
      - name: Validate (blocks the commit on schema errors)
        run: python -m pipeline.validate
      - name: Commit data
        run: 'scripts/commit-data.sh "data: cloud sources"'

  local:
    needs: cloud
    if: vars.LOCAL_RUNNER == 'true'
    runs-on: [self-hosted, immidesk]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fetch sources that block cloud IPs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: scripts/local-update.sh ${{ inputs.force && '--force' || '' }}

  freshness:
    needs: [cloud, local]
    if: always() && needs.cloud.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check freshness
        id: fresh
        continue-on-error: true
        run: python -m pipeline.validate --strict | tee freshness.txt
      - name: Open an issue for stale sources
        if: steps.fresh.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create data-stale --color B60205 --force >/dev/null 2>&1 || true
          open=$(gh issue list --label data-stale --state open --json number --jq '.[0].number')
          body=$(printf 'Run: %s\n\n```\n%s\n```' "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" "$(grep -E 'WARN|ERROR' freshness.txt)")
          if [ -n "$open" ]; then gh issue comment "$open" --body "$body"; else gh issue create --title "Stale or failing data sources" --label data-stale --body "$body"; fi
