name: Update data

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Fetch every source, ignoring min_hours
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch sources
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m pipeline.run ${{ inputs.force && '--force' || '' }}
      - name: Validate (blocks the commit on schema errors)
        run: python -m pipeline.validate
      - name: Commit data
        run: |
          git config user.name "immidesk-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data
          git diff --cached --quiet && { echo "no data changes"; exit 0; }
          git commit -m "data: update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
      - name: Check freshness
        id: fresh
        continue-on-error: true
        run: python -m pipeline.validate --strict | tee freshness.txt
      - name: Open an issue for stale sources
        if: steps.fresh.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create data-stale --color B60205 --force >/dev/null 2>&1 || true
          open=$(gh issue list --label data-stale --state open --json number --jq '.[0].number')
          body=$(printf 'Run: %s\n\n```\n%s\n```' "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" "$(grep -E 'WARN|ERROR' freshness.txt)")
          if [ -n "$open" ]; then gh issue comment "$open" --body "$body"; else gh issue create --title "Stale or failing data sources" --label data-stale --body "$body"; fi
